# Outside check of the live store, twice an hour, from GitHub's network (not from the store's own server).
# It only READS two public addresses. If the store does not answer, this run fails and GitHub e-mails the repository owner.
name: uptime
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Store answers (three tries, 20 seconds apart)
        run: |
          for i in 1 2 3; do
            h=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://litore.store/api/health || true)
            p=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://litore.store/ar || true)
            echo "try $i: health=$h home=$p"
            if [ "$h" = "200" ] && [ "$p" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::litore.store did not answer (health=$h home=$p)"; exit 1
