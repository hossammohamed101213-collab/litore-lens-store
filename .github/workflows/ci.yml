# Every change is checked here before it can reach the store: code compiles, automated tests pass, the store builds,
# and the browser tests pass against a throw-away copy with an empty test database (no real customers, cards or shipments).
name: checks
on:
  push:
    branches: [main, quality]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_PATH: /tmp/litore-ci/build.db
      UPLOAD_DIR: /tmp/litore-ci/uploads
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # the nginx request limits the deploy script installs, proven on a real nginx (skips by itself if nginx is unavailable)
      - run: sudo apt-get install -y -qq nginx >/dev/null 2>&1 || true; bash tests/nginx-limits.sh
      - run: bash tests/deploy-hardening.sh
      - run: mkdir -p /tmp/litore-ci && npm run build
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: bash scripts/e2e.sh

  # The customer journey again on the engines behind Firefox, Safari (WebKit, with an iPhone profile where the suite uses one) and Edge.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, msedge]
    env:
      DATABASE_PATH: /tmp/litore-ci/build.db
      UPLOAD_DIR: /tmp/litore-ci/uploads
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p /tmp/litore-ci && npm run build
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      # WebKit refuses Secure cookies on plain http://localhost; the switch below works only for a build made for http://localhost
      - run: E2E_PLAIN_HTTP_COOKIE=${{ matrix.browser == 'webkit' && '1' || '0' }} E2E_BROWSER=${{ matrix.browser }} bash scripts/e2e.sh purchase-journey.cjs scenarios-ui.cjs payment-and-password.cjs account-content.cjs a11y.cjs label-print.cjs
