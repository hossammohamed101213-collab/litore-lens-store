# Every change is checked here before it can reach the store: code compiles, automated tests pass, the store builds,
# and the browser tests pass against a throw-away copy with an empty test database (no real customers, cards or shipments).
name: checks
on:
  push:
    branches: [main, quality]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_PATH: /tmp/litore-ci/build.db
      UPLOAD_DIR: /tmp/litore-ci/uploads
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: mkdir -p /tmp/litore-ci && npm run build
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: bash scripts/e2e.sh
